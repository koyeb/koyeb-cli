[package]
name = "koyeb-cli"
version = "5.10.2"
edition = "2024"
license = "Apache-2.0"
description = "Koyeb command line interface"
default-run = "koyeb"

[[bin]]
name = "koyeb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
dirs = "6.0"
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.3"
serde = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
tar = "0.4"
tokio = { version = "1.43", features = ["rt-multi-thread", "time"] }
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.15"
